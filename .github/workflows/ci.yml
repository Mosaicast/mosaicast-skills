name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  metadata:
    name: Marketplace metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The plugin version lives in two files and nothing else enforces that they agree; a bumped
      # marketplace entry with a stale plugin.json ships a version consumers can never resolve.
      - name: Plugin version parity
        run: |
          set -euo pipefail
          plugin=$(jq -r '.version' plugins/mosaicast-plugin-dev/.claude-plugin/plugin.json)
          market=$(jq -r '.plugins[] | select(.name == "mosaicast-plugin-dev") | .version' .claude-plugin/marketplace.json)
          [ "$plugin" = "$market" ] || {
            echo "::error::plugin.json version=$plugin but marketplace.json says $market"
            exit 1
          }
          echo "mosaicast-plugin-dev $plugin ✅"

      # A skill without frontmatter `name` + `description` is never model-invoked — it just silently
      # never triggers, which is indistinguishable from the skill being wrong.
      - name: Every skill has frontmatter
        run: |
          set -euo pipefail
          fail=0
          for f in plugins/*/skills/*/SKILL.md; do
            head -n 1 "$f" | grep -qx -- '---' || { echo "::error file=$f::no frontmatter block"; fail=1; continue; }
            awk 'NR>1 && /^---$/{exit} NR>1' "$f" | grep -q '^name:'        || { echo "::error file=$f::frontmatter has no name"; fail=1; }
            awk 'NR>1 && /^---$/{exit} NR>1' "$f" | grep -q '^description:' || { echo "::error file=$f::frontmatter has no description"; fail=1; }
            dir=$(basename "$(dirname "$f")")
            declared=$(awk 'NR>1 && /^---$/{exit} NR>1' "$f" | sed -n 's/^name: *//p')
            [ "$dir" = "$declared" ] || { echo "::error file=$f::name '$declared' does not match directory '$dir'"; fail=1; }
          done
          exit $fail

  # This repo has no DCO workflow, so the commit-hygiene check that lives there in the other repos
  # hangs off CI here. `push` has no PR context, hence the event guard.
  session-links:
    name: No agent session links
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # A `Claude-Session:` trailer or link only opens for its author, so in a public history it is
      # noise on every agent-assisted PR. `.claude/settings.json` turns it off at the source for
      # Claude Code >= 2.1.183; this catches older clients and other agents. The id is part of the
      # pattern on purpose, so prose about the link (this file, a PR describing it) does not match.
      - name: No agent session links in commits or the PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          pattern='claude\.ai/code/session_[A-Za-z0-9_-]{6,}'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          found=0
          for c in $(git rev-list "$base".."$head"); do
            if git show -s --format=%B "$c" | grep -qiE "$pattern"; then
              echo "::error::Commit $c carries an agent session link."
              git show -s --format='  %h %s' "$c"
              found=1
            fi
          done
          if printf '%s' "$PR_BODY" | grep -qiE "$pattern"; then
            echo "::error::The PR description carries an agent session link. Remove that line."
            found=1
          fi
          if [ "$found" -ne 0 ]; then
            echo ""
            echo "Session-link check failed."
            echo "Agent attribution is welcome — keep the trailer, drop the link."
            echo 'Turn it off once:    .claude/settings.json -> { "attribution": { "sessionUrl": false } }'
            echo "Fix the last commit: git commit --amend && git push --force-with-lease"
            exit 1
          fi
          echo "No session links. ✅"
